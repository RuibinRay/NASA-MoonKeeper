<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOONKEEPER: Mars Science Center</title>
<meta name="description" content="Try the science behind the MOONKEEPER Mars outpost: gravity, air pressure, solar power in a dust storm, oxygen from the air, water from ice, and flying between worlds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;--text:#e9f2f9;--mute:#9bb0c3;--head:'Chakra Petch','Trebuchet MS',sans-serif;--body:'Inter',system-ui,'Segoe UI',sans-serif;--amber:#ffb347;--green:#58e08a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 var(--body);background:radial-gradient(1200px 600px at 80% -10%,#4a2114 0,transparent 60%),#0a0706}
  header{max-width:1000px;margin:0 auto;padding:22px 16px 6px;display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
  h1{font:700 30px/1.1 var(--head);margin:0;color:#ffd9c2;letter-spacing:.01em}
  header p{margin:4px 0 0;color:var(--mute);max-width:60ch}
  header a{color:#1a0b05;background:#e8703a;font-weight:700;text-decoration:none;padding:9px 14px;border-radius:10px;white-space:nowrap}
  main{max-width:1000px;margin:0 auto;padding:12px 16px 60px}
  #sc{padding:16px;border-radius:16px;background:rgba(18,11,9,.86);border:1px solid rgba(255,190,150,.22)}
  footer{max-width:1000px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:14px}
</style>
</head>
<body>
<header>
  <div>
    <h1 data-t>Mars Science Center</h1>
    <p data-t>Six things to try with your own hands. Every number is worked out on this page from NASA measurements, and each one says whether it is measured, tested, a plan, or a game value.</p>
  </div>
  <a href="./" data-t>Back to the game</a>
</header>
<main><div id="sc"></div></main>
<footer><p data-t>MOONKEEPER is a student project. It is not made or endorsed by NASA.</p></footer>
<script type="module">
  import { translatePage } from './js/i18n.js';
  import { mountScienceCenter } from './js/mars/science.js';
  translatePage();
  const topic = new URLSearchParams(location.search).get('topic') || 'gravity';
  window.sc = mountScienceCenter(document.getElementById('sc'), { topic });
</script>
</body>
</html>
